groups:
- name: slo-availability
  rules:
  - record: slo:availability:bad_5m
    expr: sum(increase(shop_page_views_total{code=~"5.."}[5m]))
  - record: slo:availability:bad_30m
    expr: sum(increase(shop_page_views_total{code=~"5.."}[30m]))
  - record: slo:availability:bad_60m
    expr: sum(increase(shop_page_views_total{code=~"5.."}[60m]))
  - record: slo:availability:bad_360m
    expr: sum(increase(shop_page_views_total{code=~"5.."}[360m]))
  - record: slo:availability:budget_per_minute
    expr: sum(increase(shop_page_views_total[1d])) / 1440 * 0.001
  - alert: AvailabilityBudgetBurn60m
    expr: slo:availability:bad_60m > (14.4 * 60 * slo:availability:budget_per_minute) and slo:availability:bad_5m > (14.4 * 5 * slo:availability:budget_per_minute)
    labels:
      severity: page
      slo: availability
    annotations:
      summary: availability error budget burning 14.4x over 60m
      runbook_url: https://github.com/manojrevenkar12-web/shop-edge-platform/blob/main/docs/runbooks/availability.md
  - alert: AvailabilityBudgetBurn360m
    expr: slo:availability:bad_360m > (6 * 360 * slo:availability:budget_per_minute) and slo:availability:bad_30m > (6 * 30 * slo:availability:budget_per_minute)
    labels:
      severity: page
      slo: availability
    annotations:
      summary: availability error budget burning 6x over 360m
      runbook_url: https://github.com/manojrevenkar12-web/shop-edge-platform/blob/main/docs/runbooks/availability.md
- name: slo-latency
  rules:
  - record: slo:latency:bad_5m
    expr: sum(increase(shop_page_views_slow_total[5m]))
  - record: slo:latency:bad_30m
    expr: sum(increase(shop_page_views_slow_total[30m]))
  - record: slo:latency:bad_60m
    expr: sum(increase(shop_page_views_slow_total[60m]))
  - record: slo:latency:bad_360m
    expr: sum(increase(shop_page_views_slow_total[360m]))
  - record: slo:latency:budget_per_minute
    expr: sum(increase(shop_page_views_total[1d])) / 1440 * 0.01
  - alert: LatencyBudgetBurn60m
    expr: slo:latency:bad_60m > (14.4 * 60 * slo:latency:budget_per_minute) and slo:latency:bad_5m > (14.4 * 5 * slo:latency:budget_per_minute)
    labels:
      severity: page
      slo: latency
    annotations:
      summary: latency error budget burning 14.4x over 60m
      runbook_url: https://github.com/manojrevenkar12-web/shop-edge-platform/blob/main/docs/runbooks/latency.md
  - alert: LatencyBudgetBurn360m
    expr: slo:latency:bad_360m > (6 * 360 * slo:latency:budget_per_minute) and slo:latency:bad_30m > (6 * 30 * slo:latency:budget_per_minute)
    labels:
      severity: page
      slo: latency
    annotations:
      summary: latency error budget burning 6x over 360m
      runbook_url: https://github.com/manojrevenkar12-web/shop-edge-platform/blob/main/docs/runbooks/latency.md
