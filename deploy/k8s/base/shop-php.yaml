apiVersion: v1
kind: Service
metadata:
  name: shop-php
  labels: {app: shop-php}
spec:
  selector: {app: shop-php}
  ports:
    - {name: http, port: 80, targetPort: http}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: shop-php
spec:
  maxUnavailable: 10%
  selector:
    matchLabels: {app: shop-php}
