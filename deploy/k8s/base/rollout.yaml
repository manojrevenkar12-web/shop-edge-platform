# The shop's PHP pods as an Argo Rollout: 10% canary, analysed by sep/release/canary_check.py from the Jenkins
# pipeline (see Jenkinsfile), then everyone. A release never cleans the page cache.
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: shop-php
  labels: {app: shop-php, service: shop-php}
spec:
  replicas: 6
  revisionHistoryLimit: 5
  selector:
    matchLabels: {app: shop-php}
  template:
    metadata:
      labels: {app: shop-php, service: shop-php}
    spec:
      containers:
        - name: php
          image: europe-west3-docker.pkg.dev/shop-prod/shop/php:REPLACED_BY_JENKINS
          ports:
            - {name: http, containerPort: 8080}
            - {name: metrics, containerPort: 9253}
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 5
          resources:
            requests: {cpu: "1500m", memory: 2Gi}
            limits: {memory: 2Gi}
  strategy:
    canary:
      steps:
        - setWeight: 10
        - pause: {}                 # Jenkins promotes or aborts after canary analysis
        - setWeight: 100
