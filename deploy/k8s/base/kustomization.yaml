apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: shop
resources:
  - namespace.yaml
  - varnish.yaml
  - shop-php.yaml
  - scaling.yaml
  - rollout.yaml
  - monitoring.yaml
  - slo-rules.yaml
configMapGenerator:
  - name: varnish-vcl
    files:
      - default.vcl=../../../edge/default.vcl
labels:
  - pairs: {app.kubernetes.io/part-of: shop-edge-platform}
    includeSelectors: false
